# =============================================================================
# H1 Integrated Training Pipeline Configuration - PLACE KETTLE TASK
# =============================================================================
# Task: Pick up kettle and place on charger (WITH HANDS - 26 DOF)
#   
# Usage:
#   1. Run: ./scripts/integrated_training.sh --config-file training_config_place_kettle.yaml
#   2. On robot: python h1_execution_client.py --config training_config_place_kettle.yaml
# =============================================================================

# =============================================================================
# TASK CONFIGURATION - What task are we training?
# =============================================================================
task:
  name: "place_kettle_on_base"                       # Short name for directories/checkpoints
  description: "Pick up the kettle with right hand and place it onto the charger"

# =============================================================================
# POLICY CONFIGURATION - Model and checkpoints
# =============================================================================
policy:
  config_name: "pi05_h1_auto"
  # Warmup checkpoint: pretrained on humanoid_everyday kettle data (used only for epoch 0 data collection)
  warmup_checkpoint: "/home/yuxin/Projects/openpi/checkpoints/pi05_h1_auto/place_kettle_on_base_26dof/3000"

# =============================================================================
# TRAINING CONFIGURATION - How to train
# =============================================================================
training:
  max_epochs: 1000
  save_interval: 1000
  keep_period: 1000
  num_repeats: 2
  labeling_mode: "reward_labeling"
  gpu_id: 0

# =============================================================================
# REWARD LABELING CONFIGURATION - For reward_labeling mode
# =============================================================================
reward:
  # Path to Qwen reward model checkpoint (required for reward_labeling mode)
  checkpoint_path: "/home/yuxin/Projects/openpi/third_party/emboided_reward/FT-checkpoint-1240"
  
  task_instruction: |
    Pick up the kettle with the right hand and place it onto the charger base.
    The robot should grasp the kettle handle firmly with the right hand.
    The left hand should remain open and not interfere.
    The task succeeds when the kettle is placed upright on the charger base.
    The task fails if the kettle is dropped, knocked over, or not placed on the base.
    The task fails if the robot collides with objects on the table.
    If the task fails, all frames after the failure should be scored 0.
  
  max_frames: 30
  image_rotation: 0
  advantage_threshold: 0.3

# =============================================================================
# SERVER CONFIGURATION - Policy server settings
# =============================================================================
policy_server:
  host: "localhost"
  port: 8000
  poll_interval_sec: 5

# =============================================================================
# ROBOT CONFIGURATION - H1-2 robot settings
# =============================================================================
robot:
  # Hand control ENABLED for kettle task (26 DOF = 14 arm + 12 hand)
  include_hands: true
  
  network_interface: "eno1"
  left_hand_ip: "192.168.123.211"
  right_hand_ip: "192.168.123.210"
  head_camera_server_ip: "192.168.123.163"
  head_camera_server_port: 5555

# =============================================================================
# DATA CONFIGURATION - Where to save/load data
# =============================================================================
data:
  save_dir: "./h1_data_auto"
  
  rsync:
    enabled: true
    target: "P6000:/home/yuxin/Projects/openpi/examples/h1_control_client/h1_data_auto"
    options: "-avz --progress"
    ssh_key: "~/.ssh/id_rsa"

# =============================================================================
# RECORDING CONFIGURATION - Episode recording settings
# =============================================================================
recording:
  fps: 30
  image_quality: 85

# =============================================================================
# PIPELINE CONFIGURATION - Integrated training settings
# =============================================================================
pipeline:
  start_phase: "data_collection"
  start_epoch: 0
  auto_sync: true

