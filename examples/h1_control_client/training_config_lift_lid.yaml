# =============================================================================
# H1 Integrated Training Pipeline Configuration - LIFT LID TASK
# =============================================================================
# Task: Lift lid off bowl and place on table (NO HANDS - 14 DOF)
#   
# Usage:
#   1. Run: ./scripts/integrated_training.sh --config-file training_config_lift_lid.yaml
#   2. On robot: python h1_execution_client.py --config training_config_lift_lid.yaml
# =============================================================================

# =============================================================================
# TASK CONFIGURATION - What task are we training?
# =============================================================================
task:
  name: "lift_lid"                                   # Short name for directories/checkpoints
  description: "Lift the lid on top of the bowl with both hands, move it steadily away from the bowl, and place it flat on the table"

# =============================================================================
# POLICY CONFIGURATION - Model and checkpoints
# =============================================================================
policy:
  config_name: "pi05_h1_auto"
  # Base checkpoint: pretrained on move_lid task
  base_checkpoint: "/home/yuxin/Projects/openpi/checkpoints/pi05_h1_auto/pi05_h1_move_lid/999"

# =============================================================================
# TRAINING CONFIGURATION - How to train
# =============================================================================
training:
  max_epochs: 1000
  save_interval: 1000
  keep_period: 1000
  num_repeats: 2
  labeling_mode: "reward_labeling"
  gpu_id: 0

# =============================================================================
# REWARD LABELING CONFIGURATION - For reward_labeling mode
# =============================================================================
reward:
  task_instruction: |
    Lift the lid on top of the bowl with both hands, move it steadily away from the bowl, and place it flat on the table.
    The robot must use its two hands to carefully put the lid on the table.
    Very important: The task fails if the lid slips, is flipped, drops, or is knocked off during lifting or placement.
    The task fails if the lid is not placed flat on the table (e.g., still connected to the bowl).
    The task fails if the hands of the robot collide with the bowl or the table.
    If the task fails, all the frames after the failure should be scored 0.
  
  max_frames: 30
  image_rotation: 0
  advantage_threshold: 0.3

# =============================================================================
# SERVER CONFIGURATION - Policy server settings
# =============================================================================
policy_server:
  host: "localhost"
  port: 8000
  poll_interval_sec: 5

# =============================================================================
# ROBOT CONFIGURATION - H1-2 robot settings
# =============================================================================
robot:
  # Hand control DISABLED for lift lid task (14 DOF arms only)
  include_hands: false
  
  network_interface: "eno1"
  left_hand_ip: "192.168.123.211"
  right_hand_ip: "192.168.123.210"
  head_camera_server_ip: "192.168.123.163"
  head_camera_server_port: 5555

# =============================================================================
# DATA CONFIGURATION - Where to save/load data
# =============================================================================
data:
  save_dir: "./h1_data_auto"
  
  rsync:
    enabled: true
    target: "P6000:/home/yuxin/Projects/openpi/examples/h1_control_client/h1_data_auto"
    options: "-avz --progress"
    ssh_key: "~/.ssh/id_rsa"

# =============================================================================
# RECORDING CONFIGURATION - Episode recording settings
# =============================================================================
recording:
  fps: 30
  image_quality: 85

# =============================================================================
# PIPELINE CONFIGURATION - Integrated training settings
# =============================================================================
pipeline:
  start_phase: "data_collection"
  start_epoch: 0
  auto_sync: true

